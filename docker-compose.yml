services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - websocket-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    restart: always

  websocket-server:
    build: .
    container_name: node-websocket
    depends_on:
      - mongo
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URI: ${MONGO_URI}
      DBNAME: ${DBNAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_MAX_AGE: ${JWT_MAX_AGE:-24h}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-10}
      MAX_MESSAGES_PER_SECOND: ${MAX_MESSAGES_PER_SECOND:-50}
      MAX_AUTH_FAILURES_PER_IP: ${MAX_AUTH_FAILURES_PER_IP:-5}
      BAN_DURATION_MS: ${BAN_DURATION_MS:-900000}
    restart: always

  mongo:
    image: mongo:8.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      DBNAME: ${DBNAME}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    restart: always

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  certbot-etc:
  certbot-var:
  certbot-www:
  mongo-data: